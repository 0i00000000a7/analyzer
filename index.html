<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analyzer</title>
    <script>
      (function () {
        var t = localStorage.getItem('theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <div style="max-width: 500px; margin: 60px auto; padding: 24px; font-family: system-ui, sans-serif; text-align: center">
        <h2 class="error">JavaScript Required</h2>
        <p>This application requires JavaScript to run. Please enable JavaScript in your browser settings and reload the page.</p>
      </div>
    </noscript>
    <script>
      (function () {
        var issues = [];
        if (typeof WebAssembly === 'undefined' || typeof WebAssembly.instantiate !== 'function')
          issues.push('WebAssembly');
        try { new Function('async function f(){await 0}')(); } catch (e) { issues.push('async/await'); }
        try { new Function('return import("data:text/javascript,")')(); } catch (e) { issues.push('dynamic import()'); }
        if (typeof globalThis === 'undefined') issues.push('globalThis');
        if (issues.length) {
          document.addEventListener('DOMContentLoaded', function () {
            var el = document.createElement('div');
            el.style.cssText = 'max-width:500px;margin:60px auto;padding:24px;font-family:system-ui,sans-serif;border:2px solid var(--error,#c00);border-radius:8px';
            el.innerHTML =
              '<h2 class="error" style="margin-top:0">Browser Not Supported</h2>' +
              '<p>Your browser is missing the following required features:</p>' +
              '<ul>' + issues.map(function (i) { return '<li>' + i + '</li>'; }).join('') + '</ul>' +
              '<p>Please use a modern browser such as <b>Chrome 89+</b>, <b>Firefox 89+</b>, <b>Safari 15+</b>, or <b>Edge 89+</b>.</p>';
            document.body.insertBefore(el, document.body.firstChild);
          });
        }
      })();
    </script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
