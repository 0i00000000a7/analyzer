name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-web:
    concurrency:
      group: pages
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.126

      - name: Install dependencies
        run: pnpm install

      - name: Build WASM + Vite
        run: pnpm build

      - name: Copy .nojekyll
        run: cp .nojekyll dist/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5

  build-cli:
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: analyzer-cli-linux-x86_64
            bin: analyzer-cli
          - os: ubuntu-24.04-arm
            artifact: analyzer-cli-linux-aarch64
            bin: analyzer-cli
          - os: windows-latest
            artifact: analyzer-cli-windows-x86_64.exe
            bin: analyzer-cli.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build CLI (${{ matrix.artifact }})
        run: cargo build --release -p analyzer-cli --manifest-path src/rust/Cargo.toml

      - name: Prepare artifact
        run: cp src/rust/target/release/${{ matrix.bin }} ${{ matrix.artifact }}

      - name: Upload CLI to release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.artifact }}
